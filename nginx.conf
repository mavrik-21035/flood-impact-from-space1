server {
    listen 80;
    server_name _;

    # ── Frontend (static files) ──────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy API requests to the backend container ──────────────────
    # All FastAPI routes are forwarded to the backend service.
    location ~ ^/(places|geocode|health|model-metadata|run|status|results|files|dem|report|docs|openapi\.json|redoc) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeouts for the pipeline processing endpoints
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
